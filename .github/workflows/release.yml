name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      # 回归：英文 runner 的 stdout 是 cp1252，打包脚本里的中文提示不能崩在 print 上
      - name: Check dist script under cp1252 stdout
        shell: bash
        env:
          PYTHONIOENCODING: cp1252
        run: python tools/make_dist.py --help > /dev/null

      # tag 触发：zip 用 tag 去 v 命名（v0.2.0 -> dogedit-0.2.0-x64.zip）
      - name: Build portable zip (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python tools/make_dist.py --version "${GITHUB_REF_NAME#v}"

      # 手动触发：不发 release，版本号取 Cargo.toml，产物只挂 artifact 供演练
      - name: Build portable zip (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: bash
        run: python tools/make_dist.py

      - name: Upload artifact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/dogedit-*

      - name: Create release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          dist/dogedit-*.zip dist/dogedit-*.zip.sha256
